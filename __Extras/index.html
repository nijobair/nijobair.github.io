<style>

    .widget-button-group button:not(.selected):hover {

    .widget-search-input-group {
        margin-bottom: 1rem; /* mb-4 */

    }
    .widget-search-input {

        position: absolute; /* Position relative to parent for overlay */

    .widget-suggestion-item:last-child {
        border-bottom: none;

    .widget-suggestion-item:hover {
        background-color: #f0f4f8; /* Tailwind gray-100 */
    }
    .widget-generate-button {
        width: 100%; /* w-full */
        background-color: #4f46e5; /* bg-indigo-600 */
        color: white;
        padding: 0.75rem 1.5rem; /* px-6 py-3 */
        border-radius: 0.5rem; /* rounded-lg */
        font-size: 1.25rem; /* text-xl */
        font-weight: 700; /* font-bold */
        transition: background-color 0.2s ease-in-out;
        outline: none; /* focus:outline-none */

    .widget-generate-button:hover {

        animation: spin 1s linear infinite;

        0% { transform: rotate(0deg); }

        background-color: #059669; /* Tailwind emerald-600 */
        transform: translateY(-2px);
    }

        color: #ef4444; /* Tailwind red-500 */

        font-weight: 500;

        display: none !important;
    }

        color: #6b7280; /* text-gray-500 */

</style>

<div class="widget-container">
    <h1 class="widget-title">Generate Deck</h1>

    <div class="widget-button-group">
        <button id="btnPCN">
            Search by PCN
        </button>
        <button id="btnGP">
            Search by GP Practice
        </button>
    </div>

    <div class="widget-search-input-group">
        <input type="text" id="txtSearchKeyword" placeholder="Enter keyword..."
               class="widget-search-input">
        <div id="suggestionsList" class="widget-suggestion-list hidden"></div>
    </div>

    <button id="btnGenerateDeck" class="widget-generate-button">
        Generate My Deck
    </button>

    <div id="loadingIndicator" class="widget-loading-spinner hidden"></div>
    <div id="statusMessage" class="widget-error-message hidden"></div>
    <a id="downloadLink" href="#" target="_blank" class="widget-download-button hidden">Download PowerPoint</a>

    <p class="text-gray-500 text-sm mt-4">To search for your PCN, use "Example PCN"</p>
</div>

<script>
    // --- Configuration ---
    // IMPORTANT: Replace with your Power Automate HTTP Request URL
    const POWER_AUTOMATE_FLOW_URL = "https://default48877e5789514a60ba671a610db005.5b.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/32e425cb78494691b0c46fc602d04403/triggers/manual/paths/invoke/?api-version=1";
    // IMPORTANT: Replace with your SharePoint site URL
    const SHAREPOINT_SITE_URL = "https://volumeupd.sharepoint.com/sites/Boltondeck";

    // SharePoint List Names (Internal names if different from display names)
    const PCN_LIST_NAME = "PCN Data";
    const GP_LIST_NAME = "GP Data";

    // --- DOM Elements ---
    const btnPCN = document.getElementById('btnPCN');
    const btnGP = document.getElementById('btnGP');
    const txtSearchKeyword = document.getElementById('txtSearchKeyword');
    const suggestionsList = document.getElementById('suggestionsList');
    const btnGenerateDeck = document.getElementById('btnGenerateDeck');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const statusMessage = document.getElementById('statusMessage');
    const downloadLinkBtn = document.getElementById('downloadLink');

    // --- State Variables ---
    let selectedSearchType = 'PCN'; // Default
    let currentSearchKeyword = '';
    let debounceTimer;

    // --- Event Listeners ---
    btnPCN.addEventListener('click', () => selectSearchType('PCN'));
    btnGP.addEventListener('click', () => selectSearchType('GP'));

    txtSearchKeyword.addEventListener('input', () => {
        currentSearchKeyword = txtSearchKeyword.value;
        clearTimeout(debounceTimer);
        if (currentSearchKeyword.length > 2) { // Start suggesting after 2 characters
            debounceTimer = setTimeout(fetchSuggestions, 300); // Debounce for 300ms
        } else {
            hideSuggestions();
        }
        updateGenerateButtonState();
    });

    btnGenerateDeck.addEventListener('click', generateDeck);

    // Initial UI setup
    selectSearchType(selectedSearchType); // Apply initial selection styling
    updateGenerateButtonState(); // Set initial button state

    // --- Functions ---

    function selectSearchType(type) {
        selectedSearchType = type;
        btnPCN.classList.remove('selected');
        btnGP.classList.remove('selected');
        if (type === 'PCN') {
            btnPCN.classList.add('selected');
            txtSearchKeyword.placeholder = "Enter PCN Code...";
        } else {
            btnGP.classList.add('selected');
            txtSearchKeyword.placeholder = "Enter GP Practice Code...";
        }
        txtSearchKeyword.value = ''; // Clear search bar on type change
        currentSearchKeyword = '';
        hideSuggestions();
        updateGenerateButtonState();
        hideStatusAndDownload();
    }

    function updateGenerateButtonState() {
        btnGenerateDeck.disabled = currentSearchKeyword.trim() === '';
        if (btnGenerateDeck.disabled) {
            btnGenerateDeck.classList.add('opacity-50', 'cursor-not-allowed');
        } else {
            btnGenerateDeck.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    }

    function showLoading() {
        loadingIndicator.classList.remove('hidden');
        statusMessage.classList.add('hidden');
        downloadLinkBtn.classList.add('hidden');
        btnGenerateDeck.disabled = true;
        btnGenerateDeck.classList.add('opacity-50', 'cursor-not-allowed');
    }

    function hideLoading() {
        loadingIndicator.classList.add('hidden');
        updateGenerateButtonState(); // Re-enable if keyword is present
    }

    function showStatus(message, isError = false) {
        statusMessage.textContent = message;
        statusMessage.classList.remove('hidden');
        if (isError) {
            statusMessage.classList.add('error-message');
        } else {
            statusMessage.classList.remove('error-message');
        }
    }

    function hideStatusAndDownload() {
        statusMessage.classList.add('hidden');
        downloadLinkBtn.classList.add('hidden');
        downloadLinkBtn.href = "#";
    }

    async function fetchSuggestions() {
        const listName = selectedSearchType === 'PCN' ? PCN_LIST_NAME : GP_LIST_NAME;
        // IMPORTANT: Adjust fieldToSearch based on which column you want to suggest from.
        // If searching by 'Title' (which often holds codes), use 'Title'.
        // If searching by 'PCN_Name' or 'GP_Name', use those.
        const fieldToSearch = selectedSearchType === 'PCN' ? 'PCN_Name' : 'GP_Name'; 
        const query = encodeURIComponent(`$filter=startswith(${fieldToSearch},'${currentSearchKeyword}')&$top=10`);
        const url = `${SHAREPOINT_SITE_URL}/_api/web/lists/getbytitle('${listName}')/items?${query}`;

        try {
            // SharePoint's _spPageContextInfo is usually available on modern pages for relative URLs.
            // If you encounter CORS issues, ensure SHAREPOINT_SITE_URL is absolute and your SharePoint
            // environment is configured to allow requests from the origin where this widget is embedded.
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json;odata=nometadata',
                    'Content-Type': 'application/json;odata=nometadata'
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            renderSuggestions(data.value);

        } catch (error) {
            console.error("Error fetching suggestions:", error);
            hideSuggestions();
        }
    }

    function renderSuggestions(items) {
        suggestionsList.innerHTML = '';
        if (items && items.length > 0) {
            items.forEach(item => {
                const div = document.createElement('div');
                div.classList.add('widget-suggestion-item'); // Use widget-specific class
                // Display PCN_Name or GP_Name, fallback to Title if not available
                const displayName = item.PCN_Name || item.GP_Name || item.Title;
                div.textContent = displayName;
                div.dataset.value = displayName; // Store the full name for selection
                div.addEventListener('click', () => {
                    txtSearchKeyword.value = div.dataset.value;
                    currentSearchKeyword = div.dataset.value;
                    hideSuggestions();
                    updateGenerateButtonState();
                });
                suggestionsList.appendChild(div);
            });
            suggestionsList.classList.remove('hidden');
        } else {
            hideSuggestions();
        }
    }

    function hideSuggestions() {
        suggestionsList.classList.add('hidden');
        suggestionsList.innerHTML = '';
    }

    async function generateDeck() {
        hideStatusAndDownload();
        showLoading();

        const payload = {
            searchType: selectedSearchType,
            searchKeyword: currentSearchKeyword.trim()
        };

        try {
            const response = await fetch(POWER_AUTOMATE_FLOW_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error(`Flow error! status: ${response.status}`);
            }

            const result = await response.json();

            if (result.status === 'success' && result.downloadLink) {
                downloadLinkBtn.href = result.downloadLink;
                downloadLinkBtn.classList.remove('hidden');
                showStatus("Deck generated successfully!", false);
            } else {
                showStatus(result.message || "An unknown error occurred during deck generation.", true);
            }

        } catch (error) {
            console.error("Error generating deck:", error);
            showStatus("Failed to generate deck. Please try again or contact support.", true);
        } finally {
            hideLoading();
        }
    }
</script>
