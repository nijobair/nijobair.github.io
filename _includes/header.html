<header class="sticky-header">
  <div class="container nav flex-row">
    <a href="{{ site.url }}" class="brand flex-row" aria-label="nijobair logo">
      <img
        src="/assets/images/my-logo.svg"
        alt="brand logo"
        class="brand-logo"
      />
      <div class="brand-name">
        Nazmul Islam
        <span class="brand-role block">DATA & ANALYTICS</span>
      </div>
    </a>

    <nav class="nav-links flex-row" id="navLinks">
      <a href="{{ '/portfolio' | relative_url }}">Portfolio</a>
      <a href="{{ '/blog' | relative_url }}">Blog</a>
      <a href="{{ '/#contact' | relative_url }}" id="letsTalk">Let's Talk</a>
    </nav>

    <div class="nav-controls flex-row">
      <button
        id="themeToggle"
        class="theme-toggle flex-row"
        aria-label="Toggle dark mode"
      >
        🌙
      </button>
      <button
        class="menu-btn"
        id="menuBtn"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        ☰
      </button>
    </div>
  </div>
</header>
