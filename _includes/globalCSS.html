<style>

    --col-white: #ffffff;
    --col-red: #ff0000;

    --col-gray-400: #b5a7ae;
    --col-gray-500: #8a7c83;
    --col-gray-600: #6a5c63;
    --col-gray-700: #4c4046;
    --col-gray-800: #30262b;
    --col-gray-900: #21191d;

    --col-pr-50: #fbf4f7;
    --col-pr-100: #f5e6ec;
    --col-pr-200: #e9c9d5;
    --col-pr-300: #d9a5b8;
    --col-pr-400: #be718d;
    --col-primary: #7c334f;
    --col-pr-600: #6a2b43;

    --col-pr-800: #471d2d;

    --col-pr-active: var(--col-pr-700);
    --col-pr-subtle: var(--col-pr-50);
    --col-pr-muted: var(--col-pr-100);

    --col-background: #fffcfd;

    --col-surface-raised: #ffffff;
    --col-surface-sunken: #f1ecee;
    --col-bg-code: var(--col-pr-100);

    --col-txt-default: #24191e;
    --col-txt-muted: #655960;
    --col-txt-subtle: #8a7c83;
    --col-txt-inverse: #ffffff;
    --col-txt-code: var(--col-chart-3);

    --col-border-def: #e5dde1;
    --col-border-strong: #d3c5cc;
    --col-success: #287a52;
    --col-success-bg: #eaf6ef;
    --col-warning: #a66a00;
    --col-warning-bg: #fff4d6;
    --col-danger: #b4233d;

    --font-def:

      "Segoe UI", sans-serif;
    --font-title: Georgia, "Times New Roman", serif;
    --font-mono:
      "Cascadia Code", "Source Code Pro", ui-monospace, SFMono-Regular, Menlo,
      Monaco, Consolas, monospace;

    --fw-regular: 400;
    --fw-medium: 500;
    --fw-semibold: 600;
    --fw-bold: 700;
    --fw-extrabold: 800;
    /* font size
  12px → 0.75rem
  13px → 0.8125rem
  14px → 0.875rem
  15px → 0.9375rem
  16px → 1rem
  18px → 1.125rem
  20px → 1.25rem
  24px → 1.5rem
  28px → 1.75rem
  32px → 2rem
  40px → 2.5rem
  48px → 3rem
  56px → 3.5rem
  64px → 4rem */
    --fs-display-xl: clamp(3rem, 2.25rem + 3vw, 4rem);
    --fs-display-lg: clamp(2.75rem, 2.125rem + 2.5vw, 3.5rem);
    --fs-display: clamp(2.5rem, 2rem + 2vw, 3rem);
    --fs-h1: clamp(2.25rem, 1.875rem + 1.5vw, 2.5rem);
    --fs-h2: clamp(1.875rem, 1.625rem + 1vw, 2rem);
    --fs-h3: clamp(1.625rem, 1.5rem + 0.625vw, 1.75rem);
    --fs-h4: clamp(1.375rem, 1.25rem + 0.625vw, 1.5rem);
    --fs-h5: 1.25rem;
    --fs-h6: 1.125rem;
    --fs-body-lg: 1.125rem;
    --fs-body: 1rem;
    --fs-body-sm: 0.9375rem;
    --fs-small: 0.875rem;
    --fs-xsmall: 0.75rem;
    --fs-label: 0.8125rem;
    --fs-button: 0.875rem;
    --fs-overline: 0.75rem;
    --fs-code: 0.875rem;

    --lh-none: 1;
    --lh-tight: 1.1;
    --lh-snug: 1.2;
    --lh-normal: 1.4;
    --lh-relaxed: 1.5;
    --lh-loose: 1.6;
    /* letter spacing */
    --ls-tighter: -0.03em;
    --ls-tight: -0.02em;
    --ls-normal: 0;
    --ls-wide: 0.02em;
    --ls-wider: 0.04em;
    --ls-widest: 0.08em;

    --f-display-xl: var(--fw-bold) var(--fs-display-xl) / var(--lh-tight)
      var(--font-title);
    --f-display-lg: var(--fw-bold) var(--fs-display-lg) / var(--lh-tight)
      var(--font-title);
    --f-display: var(--fw-bold) var(--fs-display) / var(--lh-tight)
      var(--font-title);
    --f-h1: var(--fw-bold) var(--fs-h1) / var(--lh-tight) var(--font-title);
    --f-h2: var(--fw-bold) var(--fs-h2) / var(--lh-snug) var(--font-title);
    --f-h3: var(--fw-bold) var(--fs-h3) / var(--lh-snug) var(--font-title);
    --f-h4: var(--fw-semibold) var(--fs-h4) / var(--lh-snug) var(--font-title);
    --f-h5: var(--fw-semibold) var(--fs-h5) / var(--lh-snug) var(--font-title);
    --f-h6: var(--fw-semibold) var(--fs-h6) / var(--lh-snug) var(--font-title);
    --f-body-lg: var(--fw-regular) var(--fs-body-lg) / var(--lh-relaxed)
      var(--font-def);
    --f-body: var(--fw-regular) var(--fs-body) / var(--lh-relaxed)
      var(--font-def);
    --f-body-md: var(--fw-medium) var(--fs-body) / var(--lh-relaxed)
      var(--font-def);
    --f-body-semibold: var(--fw-semibold) var(--fs-body) / var(--lh-relaxed)
      var(--font-def);
    --f-body-bold: var(--fw-bold) var(--fs-body) / var(--lh-relaxed)
      var(--font-def);
    --f-body-sm: var(--fw-regular) var(--fs-body-sm) / var(--lh-relaxed)
      var(--font-def);
    --f-small: var(--fw-regular) var(--fs-small) / var(--lh-normal)
      var(--font-def);
    --f-small-medium: var(--fw-medium) var(--fs-small) / var(--lh-normal)
      var(--font-def);
    --f-small-bold: var(--fw-bold) var(--fs-small) / var(--lh-normal)
      var(--font-def);
    --f-xsmall: var(--fw-regular) var(--fs-xsmall) / var(--lh-normal)
      var(--font-def);
    --f-label: var(--fw-medium) var(--fs-label) / var(--lh-normal)
      var(--font-def);
    --f-label-bold: var(--fw-bold) var(--fs-label) / var(--lh-normal)
      var(--font-def);
    --f-button: var(--fw-semibold) var(--fs-button) / var(--lh-none)
      var(--font-def);
    --f-overline: var(--fw-bold) var(--fs-overline) / var(--lh-normal)
      var(--font-def);
    --f-code: var(--fw-regular) var(--fs-code) / var(--lh-normal)
      var(--font-mono);

    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-circle: 50%;

    --border-width-thin: 1px;
    --border-width-medium: 2px;
    --border-def: var(--border-width-thin) solid var(--col-border-def);
    --border-strong: var(--border-width-medium) solid var(--col-border-strong);

    --shadow-none: none;
    --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px rgb(0 0 0 / 0.08);
    --shadow-lg: 0 10px 20px rgb(0 0 0 / 0.1);
    --shadow-xl: 0 20px 40px rgb(0 0 0 / 0.12);

    --transition-fast: 120ms ease;
    --transition-normal: 200ms ease;
    --transition-slow: 300ms ease;

    --space-0: 0;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;

    --col-txt-muted: #c8bbc1;
    --col-txt-subtle: #9c8d95;
    --col-txt-inverse: #24191e;

    --col-border-strong: #51434a;
    --border-def: var(--border-width-thin) solid var(--col-border-def);
    --border-strong: var(--border-width-medium) solid var(--col-border-strong);

    scroll-behavior: smooth;
  }
  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }
  }
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--col-background);
    color: var(--col-txt-default);
    font: var(--f-body);
  }
  main {
    flex: 1 0 auto;
  }
  .container {
    width: min(calc(100% - 48px), var(--width-max));
    margin-inline: auto;
  }
  h1,
  h2,
  h3,
  h4,
  h5,
  h6,
  p,
  figure,
  blockquote,
  dl,
  dd {
    margin: 0;
  }
  ul,
  ol {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  img,
  picture,
  video,
  canvas,
  svg {
    display: block;
    max-width: 100%;
  }
  /* Force form inputs and buttons to inherit the body font */
  button,
  input,
  select,
  textarea {
    font: inherit;
  }
  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 40;
    background-color: var(--col-background);
  }
  .abs-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .block {
    display: block;
  }
  .inline-block {
    display: inline-block;
  }
  .flex-col {
    display: flex;
    flex-direction: column;
  }
  .inflex-col {
    display: inline-flex;
    flex-direction: column;
  }
  .flex-row {
    display: flex;
    flex-direction: row;
  }
  .inflex-row {
    display: inline-flex;
    flex-direction: row;
  }
  .flex-row-wrap {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
  }
  .grid {
    display: grid;
  }
  /*
--------------------------------------------------------------
LINKS
--------------------------------------------------------------
*/
  a {
    color: inherit;
    text-decoration: none;
  }
  .link {
    color: var(--col-primary);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .link:hover {
    text-decoration-thickness: 2px;
  }
  /*
--------------------------------------------------------------
BUTTONS
--------------------------------------------------------------
*/
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-1);
    padding-inline: var(--space-4);
    padding-block: var(--space-3);
    border-radius: var(--radius-md);
    font: var(--f-button);
    cursor: pointer;
    border: none;
    transition:
      background-color var(--transition-normal),
      border-color var(--transition-normal),
      color var(--transition-normal),
      box-shadow var(--transition-normal),
      transform var(--transition-fast);
  }
  .btn:hover {
    filter: brightness(0.95);
  }

  .btn:active {
    transform: translateY(-1px);
  }
  button:disabled,
  input:disabled,
  select:disabled,
  textarea:disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }
  .btn-primary {
    background-color: var(--col-primary);
    color: var(--col-white);
  }
  .btn-primary:hover {
    background-color: var(--col-pr-hover);
  }
  .btn-secondary {
    color: var(--col-primary);
    border: 1px solid var(--col-primary);
    background: transparent;
  }
  .btn-secondary:hover {
    background-color: var(--col-pr-subtle);
  }

--------------------------------------------------------------
